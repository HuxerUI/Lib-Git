[package]
namespace = "huxerui"
name = "git"
version = "0.1.1"
standard = "c++23"
license = "MIT"
repo = "https://github.com/HuxerUI/Lib-Git"
description = "Repository inspection and Git operations for HuxerUI"

[package.metadata.huxerui]
library = "HuxerUI::Git"
namespace = "huxerui::git"
id = "org.huxerui.lib.git"
resources = "resources"

[dependencies]
huxerui.huxerui = "0.5.5"
compat.libgit2  = "1.9.7"

[targets.git]
kind = "lib"

[lib]
path = "modules/git.cppm"

[build]
sources = []
include_dirs = ["include"]

[target.windows.build]
defines = ["WIN32_LEAN_AND_MEAN", "NOMINMAX"]
